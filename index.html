<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>𝙲𝚁𝙸𝙲 𝚉𝙾𝙽𝙴 7𝚃5</title>
<style>
:root{--bg:#080d18;--panel:#111b2d;--blue:#168bff;--text:#f3f7ff;--muted:#9cabc2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:22px 15px;text-align:center;background:linear-gradient(130deg,#071a35,#102e60);border-bottom:2px solid var(--blue)}
.logo{font-size:clamp(22px,6vw,32px);font-weight:900;color:#45aaff}
header p{font-size:12px;color:#c3d8f5}
nav{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}
button,.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--blue);color:white;font-weight:bold;cursor:pointer;text-decoration:none;font-size:14px}
nav button{background:#17243a}
nav button.active{background:var(--blue)}
main{max-width:850px;margin:auto;padding:12px}
h2{font-size:20px;margin-top:22px}
.search{width:100%;padding:13px;border-radius:10px;border:1px solid #30435e;background:#101a2b;color:white;font-size:16px}
.card{background:var(--panel);border:1px solid #223550;border-radius:13px;padding:14px;margin:12px 0}
.card h3{margin:5px 0 10px;font-size:17px;overflow-wrap:anywhere}
.tag{font-size:11px;color:#70baff;font-weight:bold}
.desc{color:var(--muted);font-size:13px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.secondary{background:#263650}
form{display:grid;gap:10px}
input,select,textarea{width:100%;padding:12px;border:1px solid #30435e;border-radius:8px;background:#0b1322;color:white;font-size:15px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);padding:25px 12px;font-size:12px}
.notice{background:#102440;border-left:3px solid var(--blue);padding:12px;border-radius:6px;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="logo">𝙲𝚁𝙸𝙲 𝚉𝙾𝙽𝙴 7𝚃5</div>
  <p>CRICKET CLIPS • MATCH LINKS • HIGHLIGHTS</p>
</header>

<nav>
  <button class="active" data-page="all">HOME</button>
  <button data-page="clips">VIDEO CLIPS</button>
  <button data-page="live">LIVE MATCH</button>
  <button data-page="add">ADD LINK</button>
</nav>
