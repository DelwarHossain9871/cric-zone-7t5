<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>CRIC ZONE 7T5</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px 10px;background:#101b2d;border-bottom:2px solid #00e5a0}
header h1{color:#00e5a0;font-size:25px;margin:0}
header p{font-size:12px;color:#bac7d8}
nav{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:12px}
button{padding:11px 13px;border:0;border-radius:7px;background:#00e5a0;color:#06130e;font-weight:bold;margin:3px}
.red{background:#e63950;color:white}
.blue{background:#2879d8;color:white}
main{max-width:850px;margin:auto;padding:12px}
.panel{background:#101b2d;border:1px solid #293a52;border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:18px;color:#00e5a0}
input,select{width:100%;padding:12px;margin:5px 0 12px;background:#080d18;color:white;border:1px solid #354963;border-radius:7px}
video{display:block;width:100%;background:#000;border-radius:8px;max-height:65vh}
#yt{display:none;width:100%;aspect-ratio:16/9;border:0}
#status{font-size:13px;color:#00e5a0;overflow-wrap:anywhere}
.small{font-size:12px;color:#bac7d8;line-height:1.6}
.item{padding:12px;margin:8px 0;background:#1a2940;border-radius:8px;overflow-wrap:anywhere}
footer{text-align:center;padding:20px;color:#8998ad;font-size:12px}
</style>
</head>
<body>
<header>
<h1>𝙲𝚁𝙸𝙲 𝚉𝙾𝙽𝙴 7𝚃5</h1>
<p>CRICKET CLIPS • VIDEO PLAYER • LIVE MATCH</p>
</header>
<nav>
<button onclick="showPage('home')">🏠 HOME</button>
<button onclick="showPage('clips')">🎬 CLIPS</button>
<button onclick="showPage('live')">🔴 LIVE MATCH</button>
<button onclick="showPage('add')">➕ ADD VIDEO</button>
</nav>
<main>
  
<input id="videoUrl" type="url" placeholder="ভিডিওর লিংক এখানে দাও">
<button onclick="addVideo()">➕ ADD VIDEO</button>

<section id="home" class="panel">
<h2>▶ VIDEO PLAYER</h2>
<video id="player" controls playsinline></video>
<iframe id="yt" allowfullscreen allow="autoplay; encrypted-media"></iframe>
<p id="status">ভিডিও যোগ করে চালাও।</p>
<button class="red" onclick="startRec()">⏺ REC</button>
<button class="blue" onclick="stopRec()">⏹ STOP</button>
<div id="saveArea"></div>
<p class="small">সব M3U8 স্ট্রিম রেকর্ড হবে না। YouTube বা সুরক্ষিত স্ট্রিম সরাসরি রেকর্ড করা যায় না।</p>
</section>
<section id="add" class="panel" hidden>
<h2>➕ ADD VIDEO / LIVE LINK</h2>
<label>ভিডিওর নাম</label>
<input id="vname" placeholder="Bangladesh vs India">
<label>ভিডিও URL</label>
<input id="vurl" placeholder="M3U8 / MP4 / YouTube link">
<label>ভিডিওর ধরন</label>
<select id="vtype">
<option value="clip">Cricket Video / Clip</option>
<option value="live">Live Match Link</option>
</select>
<button onclick="addVideo()">ADD TO WEBSITE</button>
</section>
<section id="clips" class="panel" hidden>
<h2>🎬 CRICKET CLIPS</h2>
<div id="clipList"></div>
</section>
<section id="live" class="panel" hidden>
<h2>🔴 LIVE MATCH</h2>
<div id="liveList"></div>
</section>
</main>
<footer>CRIC ZONE 7T5 • Cricket videos and match links</footer>
<script>
  const playerEl=document.getElementById('player');
const ytEl=document.getElementById('yt');
const statusEl=document.getElementById('status');
let hls=null,recorder=null,chunks=[];

let entries=[];
try{
 entries=JSON.parse(localStorage.getItem('cric75_entries')||'[]');
 if(!Array.isArray(entries))entries=[];
}catch(e){entries=[]}

function showPage(id){
 ['home','clips','live','add'].forEach(x=>{
  document.getElementById(x).hidden=x!==id;
 });
 renderLists();
}

function saveEntries(){
 try{
  localStorage.setItem('cric75_entries',JSON.stringify(entries));
 }catch(e){
  alert('ভিডিও তালিকা সেভ করা যায়নি।');
 }
}

function getYoutubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);
  if(u.hostname.includes('youtube.com')){
   if(u.pathname==='/watch')return u.searchParams.get('v');
   if(u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2];
   if(u.pathname.startsWith('/shorts/'))return u.pathname.split('/')[2];
  }
 }catch(e){}
 return null;
}

function playVideo(url,name){
 if(recorder&&recorder.state==='recording'){
  alert('আগে STOP চাপো।');
  return;
 }
 if(hls){hls.destroy();hls=null}
 playerEl.pause();
 playerEl.removeAttribute('src');
 playerEl.load();
 ytEl.src='';
 ytEl.style.display='none';
 playerEl.style.display='block';
 document.getElementById('saveArea').innerHTML='';

 const id=getYoutubeId(url);
 if(id){
  playerEl.style.display='none';
  ytEl.style.display='block';
  ytEl.src='https://www.youtube.com/embed/'+encodeURIComponent(id);
  statusEl.textContent='YouTube: '+name;
  showPage('home');
  return;
 }

 if(/\.m3u8(?:$|\?)/i.test(url)){
  if(window.Hls&&Hls.isSupported()){
   hls=new Hls();
   hls.loadSource(url);
   hls.attachMedia(playerEl);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    statusEl.textContent='M3U8 লোড হয়েছে: '+name;
   });
   hls.on(Hls.Events.ERROR,(e,d)=>{
    if(d.fatal)statusEl.textContent='স্ট্রিম চালানো যায়নি। লিংক বা সার্ভার পরীক্ষা করো।';
   });
  }else if(playerEl.canPlayType('application/vnd.apple.mpegurl')){
   playerEl.src=url;
  }else{
   statusEl.textContent='এই ব্রাউজারে M3U8 সাপোর্ট নেই।';
   return;
  }
 }else{
  playerEl.src=url;
 }
 statusEl.textContent='ভিডিও লোড হচ্ছে: '+name;
 playerEl.play().catch(()=>{
  statusEl.textContent='ভিডিও চালাতে Play চাপো।';
 });
 showPage('home');
}

function addVideo(){
 const name=document.getElementById('vname').value.trim();
 const url=document.getElementById('vurl').value.trim();
 const type=document.getElementById('vtype').value;
 if(!name||!url){
  alert('নাম ও লিংক দুটোই দাও।');
  return;
 }
 try{
  const u=new URL(url);
  if(!['http:','https:'].includes(u.protocol))throw Error();
 }catch(e){
  alert('সঠিক http/https লিংক দাও।');
  return;
 }
 entries.unshift({name,url,type});
 saveEntries();
 document.getElementById('vname').value='';
 document.getElementById('vurl').value='';
 renderLists();
 playVideo(url,name);
}

function renderLists(){
 const clipBox=document.getElementById('clipList');
 const liveBox=document.getElementById('liveList');
 clipBox.innerHTML='';
 liveBox.innerHTML='';
 entries.forEach((entry,index)=>{
  const target=entry.type==='live'?liveBox:clipBox;
  const div=document.createElement('div');
  div.className='item';
  const title=document.createElement('div');
  title.textContent=entry.name;
  const play=document.createElement('button');
  play.textContent='▶ PLAY';
  play.onclick=()=>playVideo(entry.url,entry.name);
  const del=document.createElement('button');
  del.textContent='DELETE';
  del.className='red';
  del.onclick=()=>{
   entries.splice(index,1);
   saveEntries();
   renderLists();
  };
   function startRec(){
 if(ytEl.style.display!=='none'&&ytEl.src){
  alert('YouTube ভিডিও সরাসরি রেকর্ড করা যাবে না।');
  return;
 }
 if(!playerEl.currentSrc&&!hls){
  alert('আগে একটি ভিডিও চালাও।');
  return;
 }
 if(!window.MediaRecorder){
  alert('এই ব্রাউজারে রেকর্ডিং সাপোর্ট নেই।');
  return;
 }
 const capture=playerEl.captureStream||playerEl.mozCaptureStream;
 if(!capture){
  alert('এই ব্রাউজারে ভিডিও রেকর্ডিং সাপোর্ট নেই।');
  return;
 }
 try{
  const stream=capture.call(playerEl);
  if(!stream.getVideoTracks().length){
   alert('ভিডিও স্ট্রিম পাওয়া যায়নি।');
   return;
  }
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
   ?'video/webm;codecs=vp8,opus':'video/webm';
  recorder=new MediaRecorder(
   stream,
   MediaRecorder.isTypeSupported(mime)?{mimeType:mime}:{}
  );
  chunks=[];
  recorder.ondataavailable=e=>{
   if(e.data&&e.data.size)chunks.push(e.data);
  };
  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});
   if(!blob.size){
    statusEl.textContent='রেকর্ডিং খালি হয়েছে।';
    return;
   }
   const objectURL=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=objectURL;
   a.download='CRIC-ZONE-7T5-clip.webm';
   a.textContent='📥 SAVE VIDEO TO PHONE';
   a.style.cssText='display:inline-block;padding:14px;background:#00e5a0;color:#06130e;border-radius:8px;margin-top:12px;text-decoration:none;font-weight:bold';
   const area=document.getElementById('saveArea');
   area.innerHTML='';
   area.appendChild(a);
   statusEl.textContent='রেকর্ডিং শেষ। Save Video চাপো।';
  };
  recorder.onerror=()=>{
   statusEl.textContent='রেকর্ডিংয়ে সমস্যা হয়েছে।';
  };
  recorder.start();
  statusEl.textContent='🔴 RECORDING চলছে...';
 }catch(e){
  statusEl.textContent='REC শুরু করা যায়নি: '+e.message;
 }
}

function stopRec(){
 if(recorder&&recorder.state==='recording'){
  recorder.stop();
 }else{
  statusEl.textContent='এখন কোনো রেকর্ডিং চলছে না।';
 }
}

renderLists();
</script>
</body>
</html>
